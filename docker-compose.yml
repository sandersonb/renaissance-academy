# Local dev stack: MySQL + API + React. `docker compose up` then open
# http://localhost:5173. The DB auto-loads the no-PII schema and additive
# migrations on first init (alphabetical order). node_modules live in named
# volumes (installed in-container) so host (macOS) binaries don't leak in.
services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: enrollment
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./db/migrations/001_additive.sql:/docker-entrypoint-initdb.d/01_additive.sql:ro
      - ./db/migrations/002_survey_data.sql:/docker-entrypoint-initdb.d/02_survey_data.sql:ro
      - ./db/migrations/003_password_reset.sql:/docker-entrypoint-initdb.d/03_reset.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: node:22
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: secret
      DB_NAME: enrollment
      PORT: "3001"
      APP_BASE_URL: http://localhost:5173
      BCRYPT_COST: "10"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: sh -c "npm install && npm start"

  web:
    image: node:22
    working_dir: /app/web
    depends_on:
      - api
    environment:
      API_PROXY: http://api:3001
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/web/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
