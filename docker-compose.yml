# Local dev stack: MySQL + API + React. See README for the explicit migration
# and cycle-init commands BEFORE starting the API. Only the no-PII base schema
# auto-loads on a fresh volume; never bypass the migration ledger. node_modules live in named
# volumes (installed in-container) so host (macOS) binaries don't leak in.
services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: enrollment
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: node:22
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: secret
      DB_NAME: enrollment
      NODE_ENV: development
      DB_TLS_MODE: disabled
      PORT: "3001"
      APP_BASE_URL: http://localhost:5173
      BCRYPT_COST: "10"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: sh -c "npm install && npm start"

  web:
    image: node:22
    working_dir: /app/web
    depends_on:
      - api
    environment:
      API_PROXY: http://api:3001
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/web/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
